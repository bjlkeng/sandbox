[project]
name = "rl-math"
version = "0.1.0"
description = "Small reinforcement learning experiments for a mathematical primer"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "torch>=2.6,<3",
]

[dependency-groups]
dev = [
    "ipykernel>=6,<8",
    "jupyterlab>=4,<5",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
